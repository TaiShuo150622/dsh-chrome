name: Feature request
description: 建议新的浏览器能力或体验改进
labels: [enhancement]
body:
  - type: input
    id: capability
    attributes:
      label: 想要的能力
      placeholder: "例如：hover / 拖拽 / 下载进度等待"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要
      description: 对应的真实网页任务；现在的替代做法
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: 期望的工具形态（可选）
      description: 工具名、参数、返回；是否属于硬敏感动作
      render: markdown
  - type: dropdown
    id: reference
    attributes:
      label: 参考产品
      options:
        - Claude in Chrome
        - Codex
        - 其他（在描述里说明）
        - 无

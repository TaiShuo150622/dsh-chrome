<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH Chrome</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        width: 300px;
        background: #111318;
        color: #e8eaf0;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
      }
      .sub {
        margin: 0 0 12px;
        font-size: 11px;
        color: #8b93a7;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
      }
      .ok {
        background: #17351f;
        color: #4ade80;
      }
      .bad {
        background: #3a1b1f;
        color: #f87171;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      button {
        margin-left: auto;
        padding: 4px 10px;
        border: 1px solid #2d3444;
        border-radius: 6px;
        background: #1b1f29;
        color: #cfd6e6;
        font-size: 11px;
        cursor: pointer;
      }
      button:hover {
        border-color: #4a5670;
      }
      .actions {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .actions button {
        margin-left: 0;
      }
      dl {
        margin: 12px 0 0;
        font-size: 12px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 10px;
      }
      dt {
        color: #8b93a7;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      p.hint {
        margin: 12px 0 0;
        font-size: 11px;
        line-height: 1.5;
        color: #a0a8bc;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        background: #1b1f29;
        padding: 1px 4px;
        border-radius: 4px;
      }
      .cursor {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid #252b38;
      }
      .cursor h2 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: #cfd6e6;
      }
      .cursor .line {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 6px;
      }
      .cursor select,
      .cursor input[type="file"] {
        min-width: 0;
        flex: 1;
        color: #cfd6e6;
        background: #1b1f29;
        border: 1px solid #2d3444;
        border-radius: 6px;
        padding: 4px 6px;
        font-size: 11px;
      }
      .cursor img {
        width: 28px;
        height: 28px;
        object-fit: contain;
        border-radius: 4px;
        background: #0d0f14;
      }
      #cursor-status {
        margin-top: 6px;
        font-size: 10px;
        color: #8b93a7;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>DSH Desktop Chrome</h1>
    <p class="sub">P2 · tabs, actions, console, virtual cursor</p>
    <div class="row">
      <span id="badge" class="badge bad">checking…</span>
      <span class="actions">
        <button id="focus">Show tab</button>
        <button id="reconnect">Reconnect</button>
        <button id="reload">Reload</button>
        <button id="sidebar" title="Open the DSH sidebar">Sidebar</button>
      </span>
    </div>
    <dl>
      <dt>Extension</dt>
      <dd id="version">—</dd>
      <dt>Session tab</dt>
      <dd id="tab">—</dd>
      <dt>Self-heal</dt>
      <dd id="selfheal">—</dd>
      <dt>Dev reload</dt>
      <dd id="autoupdate">—</dd>
    </dl>
    <div class="cursor">
      <h2>Cursor</h2>
      <div class="line">
        <select id="cursor-preset" aria-label="Cursor preset">
          <option value="whale">Whale (DSH)</option>
          <option value="arrow">Arrow</option>
          <option value="dot">Dot</option>
          <option value="crosshair">Crosshair</option>
        </select>
        <button id="cursor-reset" type="button">Reset</button>
      </div>
      <div class="line">
        <input id="cursor-file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Upload cursor image" />
        <img id="cursor-preview" alt="" hidden />
      </div>
      <div id="cursor-status">Local image only · PNG/JPEG/WebP · ≤256 KB</div>
    </div>
    <p class="hint" id="hint"></p>
    <script src="popup.js"></script>
  </body>
</html>

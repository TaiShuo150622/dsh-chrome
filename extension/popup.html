<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH Chrome</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        width: 300px;
        background: #111318;
        color: #e8eaf0;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
      }
      .sub {
        margin: 0 0 12px;
        font-size: 11px;
        color: #8b93a7;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
      }
      .ok {
        background: #17351f;
        color: #4ade80;
      }
      .bad {
        background: #3a1b1f;
        color: #f87171;
      }
      dl {
        margin: 12px 0 0;
        font-size: 12px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 10px;
      }
      dt {
        color: #8b93a7;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      p.hint {
        margin: 12px 0 0;
        font-size: 11px;
        line-height: 1.5;
        color: #a0a8bc;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        background: #1b1f29;
        padding: 1px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>DSH Desktop Chrome</h1>
    <p class="sub">P0 spike · control stays in background tabs</p>
    <span id="badge" class="badge bad">checking…</span>
    <dl>
      <dt>Extension</dt>
      <dd id="version">—</dd>
      <dt>Session tab</dt>
      <dd id="tab">—</dd>
    </dl>
    <p class="hint" id="hint"></p>
    <script src="popup.js"></script>
  </body>
</html>
